<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MikroTik Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-card">

        <div class="login-header">
            <h1>Autenticação</h1>
            <img 
                src="img/logo.jpeg" 
                alt="Logo MikroTik Manager" 
                class="logo"
            >
        </div>

        <form action="painel.html">

            <div class="campo">
                <input 
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                >
            </div>

            <div class="campo">
                <input 
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                >
            </div>

            <button type="submit">
                Entrar
            </button>


        </form>

    </div>

</body>
</html>
